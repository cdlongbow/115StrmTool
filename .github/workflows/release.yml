name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '20*'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（需与 CHANGELOG 顶部条目标题一致，如 20261003；同日再次发布加序号，如 20261003-2）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency check
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python -c "
          import os, re
          from pathlib import Path
          ref = os.environ['RELEASE_REF'].strip().lstrip('v')
          m = re.search(r'^##\s*\[(.+?)\]', Path('CHANGELOG.md').read_text(encoding='utf-8'), re.M)
          if not ref:
              raise SystemExit('release ref is empty')
          kb = re.fullmatch(r'(\d{8})(?:-(\d{1,2}))?', ref)
          if not kb:
              raise SystemExit('release ref must be YYYYMMDD or same-day serial YYYYMMDD-N')
          if kb.group(2) is not None and not 1 <= int(kb.group(2)) <= 99:
              raise SystemExit('same-day serial suffix must be between 1 and 99')
          if not m:
              raise SystemExit('CHANGELOG.md has no version heading like ## [2026-10-03]')
          head = m.group(1)
          norm = lambda s: s.replace('-', '').replace('_', '')
          if norm(kb.group(1)) != norm(head):
              raise SystemExit(f'version mismatch: release ref={ref} changelog head={head}')
          print('OK: release ref ' + ref + ' matches CHANGELOG head ' + head)
          "

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install local wheels (skip platform-incompatible)
        run: |
          python -m pip install -U pip
          python scripts/install_local_wheels.py combined/wheels

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --find-links combined/wheels -r combined/requirements-dev.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Windows tray dependency
        run: python -c "import pystray; print(pystray.__version__)"

      - name: Check real SDK contract
        run: python scripts/smoke_sdk_contract.py

      - name: Check inline JavaScript syntax
        run: python scripts/check_inline_js.py combined/web/index.html

      - name: Run frontend behavior tests
        run: node scripts/test_frontend.js

      - name: Lint
        run: ruff check .

      - name: Run engineering script tests
        run: python -m pytest scripts/test_engineering_scripts.py -q

      - name: Run tests
        working-directory: combined
        run: python -m pytest -q

      - name: Run each test file standalone
        working-directory: combined
        run: |
          Get-ChildItem -Path test_*.py | ForEach-Object {
            python -m pytest $_.FullName -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Inject build version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python -c "
          import os
          from pathlib import Path
          ref = os.environ['RELEASE_REF'].strip().lstrip('v')
          if not ref:
              raise SystemExit('release ref is empty')
          Path('combined/_build_version.py').write_text(
              '__version__ = ' + repr(ref) + '\n', encoding='utf-8'
          )
          print('Injected build version:', ref)
          "

      - name: Build executable
        working-directory: combined
        run: python build_exe.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Smoke test frozen executable
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_REF.Trim().TrimStart([char[]]'v')
          python scripts/smoke_frozen_exe.py `
            --exe "combined/dist/115网盘STRM生成与302工具.exe" `
            --data-dir "$env:RUNNER_TEMP\strm-exe-smoke" `
            --version "$version"

      - name: Write dependency manifest
        run: |
          python -c "import pathlib, subprocess, sys; pathlib.Path('combined/dist/dependencies.txt').write_text(subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True), encoding='utf-8')"

      - name: Write SHA256 checksum
        run: python scripts/write_sha256.py "combined/dist/115网盘STRM生成与302工具.exe"

      - name: Extract changelog for release notes
        run: |
          python -c "
          from pathlib import Path
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          notes, started = [], False
          for line in lines:
              if line.startswith('## '):
                  if started:
                      break
                  started = True
              if started:
                  notes.append(line)
          Path('release_notes.md').write_text('\n'.join(notes).strip() + '\n', encoding='utf-8')
          print('Release notes head:', notes[0] if notes else '(empty)')
          "

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          body_path: release_notes.md
          files: |
            combined/dist/115网盘STRM生成与302工具.exe
            combined/dist/115网盘STRM生成与302工具.exe.sha256
            combined/dist/dependencies.txt
          generate_release_notes: true

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.ref_name }}
          path: |
            combined/dist/
            combined/logs/
            ${{ runner.temp }}/strm-exe-smoke/logs/
          if-no-files-found: ignore
          retention-days: 7
