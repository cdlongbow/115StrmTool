name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '20*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（需与 CHANGELOG 顶部条目标题一致，如 20261003）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency check
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python -c "
          import os, re
          from pathlib import Path

          ref = os.environ['RELEASE_REF'].strip().lstrip('v')
          m = re.search(r'^##\s*\[(.+?)\]', Path('CHANGELOG.md').read_text(encoding='utf-8'), re.M)
          if not ref:
              raise SystemExit('release ref is empty')
          if not m:
              raise SystemExit('CHANGELOG.md has no version heading like: ## [2026-10-03]')
          head = m.group(1)
          norm = lambda s: s.replace('-', '').replace('_', '')
          if norm(ref) != norm(head):
              raise SystemExit('version mismatch: release ref=' + ref + ' changelog head=' + head)
          print('OK: release ref ' + ref + ' matches CHANGELOG head ' + head)
          "

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install p115 SDK and local-only wheels
        run: |
          python -m pip install -U pip
          python -c "
          import subprocess, sys
          from pathlib import Path

          skip_tags = ('macosx', 'manylinux', 'musllinux', 'aarch64')
          for f in sorted(Path('combined/wheels').glob('*.whl')):
              if any(s in f.name for s in skip_tags):
                  print(f'Skip: {f.name}')
                  continue
              print(f'Install: {f.name}')
              subprocess.run([sys.executable, '-m', 'pip', 'install', str(f)], check=True)
          "

      - name: Install dependencies
        run: |
          pip install -r combined/requirements.txt
          pip install pystray pytest pytest-asyncio

      - name: Run tests
        working-directory: combined
        run: python -m pytest -q

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        working-directory: combined
        run: python build_exe.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Extract changelog for release notes
        run: |
          python -c "
          from pathlib import Path

          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          notes, started = [], False
          for line in lines:
              if line.startswith('## '):
                  if started:
                      break
                  started = True
              if started:
                  notes.append(line)
          Path('release_notes.md').write_text('\n'.join(notes).strip() + '\n', encoding='utf-8')
          print('Release notes head:', notes[0] if notes else '(empty)')
          "

      - name: Upload executable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 115StrmTool-Windows
          path: combined/dist/115网盘STRM生成与302工具.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          body_path: release_notes.md
          files: combined/dist/115网盘STRM生成与302工具.exe
          generate_release_notes: true
