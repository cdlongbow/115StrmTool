name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install local wheels (skip platform-incompatible)
        run: |
          python -m pip install -U pip
          python scripts/install_local_wheels.py combined/wheels

      - name: Install dependencies
        run: |
          python -m pip install --find-links combined/wheels -r combined/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check inline JavaScript syntax
        run: python scripts/check_inline_js.py combined/web/index.html

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: combined
        run: python -m pytest -q

      - name: Run each test file standalone
        working-directory: combined
        run: |
          for f in test_*.py; do
            python -m pytest "$f" -q || exit 1
          done
