name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local wheels (skip platform-incompatible)
        run: |
          python -m pip install -U pip
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          for f in sorted(Path('combined/wheels').glob('*.whl')):
              r = subprocess.run(
                  [sys.executable, '-m', 'pip', 'install', str(f)],
                  capture_output=True,
                  text=True,
              )
              print(f"{'OK  ' if r.returncode == 0 else 'SKIP'}: {f.name}")
          PY

      - name: Install dependencies
        run: |
          pip install -r combined/requirements.txt
          pip install pytest pytest-asyncio

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: combined
        run: python -m pytest -q
